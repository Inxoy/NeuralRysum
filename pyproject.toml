[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralrysum"
version = "0.1.0"
description = "Split-rate neural audio synthesis: low-latency timbre transfer, MIDI and free latent navigation"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy", "scipy", "soundfile"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["neuralrysum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
